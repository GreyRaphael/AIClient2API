name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: 内置插件类型检查
        run: npm run typecheck:plugins

      - name: 严格度棘轮检查
        run: npm run check:strict

      - name: any 债务棘轮检查
        run: npm run check:any

      - name: 运行时导入完整性检查
        run: npm run check:imports

      - name: 运行时循环依赖检查
        run: npm run check:cycles

      - name: 类型债务指标
        run: npm run metrics:types

      - name: 单元测试与覆盖率
        run: npm run test:coverage -- --runInBand

      - name: 覆盖率门槛
        run: npm run check:coverage

      - name: 运行时 smoke（plain Node）
        run: npm run test:runtime
        env:
          SMOKE_SERVER: '1'
