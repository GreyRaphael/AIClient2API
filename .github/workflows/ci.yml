name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 本版本起只支持 Node.js 26+（engines: >=26.0.0），因此不再做多版本矩阵。
    # 版本下限由 tests/runtime-check.test.js 的真实主版本校验守护：
    # 仅探测 process.features.typescript 是不够的，Node 22/24 同样会静默通过。

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      # static/ui 无构建步骤，语法与 ESM import 图的唯一守护；
      # 已由 tsc 取代 tests/static-syntax.test.js 与 tests/static-import-graph.test.js。
      - name: WebUI 静态类型检查
        run: npm run typecheck:webui

      - name: 严格度棘轮检查
        run: npm run check:strict

      - name: any 债务棘轮检查
        run: npm run check:any

      - name: 运行时导入完整性检查
        run: npm run check:imports

      - name: 运行时循环依赖检查
        run: npm run check:cycles

      - name: CSS 静态检查
        run: npm run lint:css

      - name: HTML 外壳一致性检查
        run: npm run gen:webui-html:check

      - name: WebUI Vendor 同步检查
        run: npm run vendor:webui:check

      - name: 类型债务指标
        run: npm run metrics:types

      - name: 核心单元测试
        run: npm test -- --runInBand

      - name: 原生 Node 26 诊断测试
        run: npm run test:node

      - name: 运行时 smoke（plain Node）
        run: npm run test:runtime
        env:
          SMOKE_SERVER: '1'
