<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#059669">
    <script>
        // 提前应用已保存的主题，避免闪烁
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>

  <title>模型用量统计</title>
  <link rel="stylesheet" href="app/base.css">
  <link rel="stylesheet" href="app/mobile.css">
  <link rel="stylesheet" href="vendor/fontawesome@6.7.2/fa-subset.css">
  <style>
    body {
      background: var(--bg-secondary);
      min-height: 100vh;
    }

    /* 响应式基础调整 */
    @media (max-width: 768px) {
      .navbar-inner, .main {
        padding: 0 12px;
      }
      .navbar-inner {
        height: 60px;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }
      .brand-icon { width: 32px; height: 32px; border-radius: 8px; }
      .brand-title { font-size: 15px; }
      .brand-sub { display: none; }
      
      .nav-actions { width: auto; gap: 8px; }
      .nav-btn { min-width: 40px; padding: 0 10px; border-radius: 10px; }
      .nav-btn span { display: none; }
      .theme-toggle { border-radius: 10px; }
      
      .hero { grid-template-columns: 1fr !important; gap: 16px; }
      .hero-main { padding: 20px; }
      .hero-main h1 { font-size: 22px; }
      .copy { font-size: 13px; }
      
      .auth { padding: 20px; }
      .row { flex-direction: column; }
      .row .btn { width: 100%; }
      
      .stats { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
      .stats article:last-child { grid-column: span 2; }
      .card { padding: 16px; }
      .card-value { font-size: 20px; }
      .note { font-size: 11px; }
      
      .split { grid-template-columns: 1fr !important; gap: 16px; }
      
      .providers { grid-template-columns: 1fr !important; gap: 12px; }
      .provider { padding: 16px; }
      .provider-head { flex-direction: column; align-items: flex-start; gap: 8px; }
      .mini { grid-template-columns: 1fr 1fr !important; gap: 8px; }
      .mini-box { background: var(--bg-secondary); padding: 8px; border-radius: 6px; }
      
      .tools { flex-direction: column; align-items: stretch !important; gap: 12px; }
      .tool-row { flex-direction: column; gap: 10px; }
      
      .table-card .tools { padding: 16px; }
      th, td { padding: 12px 10px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr !important; }
      .stats article { grid-column: span 1 !important; }
      .mini { grid-template-columns: 1fr !important; }
      .brand-title { font-size: 15px; }
      h1 { font-size: 20px; }
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .navbar-inner,
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .navbar-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      color: #fff;
      box-shadow: var(--shadow-md);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn,
    .theme-toggle,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition);
    }

    .theme-toggle {
      width: 40px;
      padding: 0;
      color: var(--text-secondary);
    }

    .nav-btn:hover,
    .theme-toggle:hover,
    .btn:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .theme-toggle .fa-sun {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .fa-sun {
      display: inline-block;
    }

    [data-theme="dark"] .theme-toggle .fa-moon {
      display: none;
    }

    .main {
      padding: 30px 24px 48px;
    }

    .panel,
    .card,
    .provider,
    .table-card,
    .empty {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
    }

    .hero,
    .split,
    .stats {
      display: grid;
      gap: 24px;
    }

    .hero {
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
      margin-bottom: 24px;
    }

    .split {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      margin-bottom: 24px;
    }

    .calendar-panel {
      padding: 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .calendar-legend {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .calendar-legend .level {
      width: 9px;
      height: 9px;
      border-radius: 1px;
    }

    .calendar-wrapper {
      overflow-x: auto;
      padding: 5px 0;
      display: flex;
      justify-content: flex-start;
    }

    .calendar-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 11px);
      gap: 3px;
      min-width: max-content;
    }

    .calendar-day {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--bg-secondary);
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .calendar-day:hover {
      transform: scale(1.2);
      z-index: 10;
      outline: 1px solid var(--primary-color);
    }

    .calendar-footer {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .level-0,
    .calendar-day[data-level="0"] {
      background: var(--bg-secondary);
    }

    .level-1,
    .calendar-day[data-level="1"] {
      background: #9be9a8;
    }

    .level-2,
    .calendar-day[data-level="2"] {
      background: #40c463;
    }

    .level-3,
    .calendar-day[data-level="3"] {
      background: #30a14e;
    }

    .level-4,
    .calendar-day[data-level="4"] {
      background: #216e39;
    }

    [data-theme="dark"] .level-1,
    [data-theme="dark"] .calendar-day[data-level="1"] {
      background: #0e4429;
    }

    [data-theme="dark"] .level-2,
    [data-theme="dark"] .calendar-day[data-level="2"] {
      background: #006d32;
    }

    [data-theme="dark"] .level-3,
    [data-theme="dark"] .calendar-day[data-level="3"] {
      background: #26a641;
    }

    [data-theme="dark"] .level-4,
    [data-theme="dark"] .calendar-day[data-level="4"] {
      background: #39d353;
    }

    .calendar-tooltip {
      position: fixed;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      font-size: 11px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 1000;
      display: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      white-space: pre-line;
      line-height: 1.4;
    }

    .stats {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 24px;
    }

    .hero-main,
    .auth,
    .panel,
    .table-card {
      padding: 24px;
    }

    .eyebrow,
    .pill,
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .eyebrow {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .pill {
      background: var(--success-10);
      border: 1px solid var(--primary-30);
      color: var(--success-text);
    }

    .pill.idle {
      background: var(--bg-secondary);
      border-color: var(--border-color);
      color: var(--text-secondary);
    }

    h1 {
      margin: 14px 0 12px;
      font-size: 30px;
      line-height: 1.2;
      color: var(--text-primary);
    }

    .copy,
    .sub,
    .help,
    .footer,
    .note {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .meta .tag {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .title,
    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      margin-bottom: 12px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .input,
    .select,
    .search {
      width: 100%;
      min-height: 42px;
      padding: 0 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 14px;
      transition: var(--transition);
    }

    .input {
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .input:focus,
    .select:focus,
    .search:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px var(--primary-10);
    }

    .group {
      margin-bottom: 16px;
    }

    .row,
    .tool-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      margin-top: 16px;
      font-size: 13px;
      border: 1px solid transparent;
    }

    .status.show {
      display: flex;
    }

    .status.info {
      background: var(--info-bg-alt);
      border-color: var(--info-border);
      color: var(--info-text);
    }

    .status.success {
      background: var(--success-10);
      border-color: var(--primary-30);
      color: var(--success-text);
    }

    .status.error {
      background: var(--danger-10);
      border-color: var(--danger-30);
      color: var(--danger-text);
    }

    .hero-main {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .hero-main h1,
    .hero-main .eyebrow,
    .hero-main .copy,
    .hero-main .tag {
      color: #fff;
    }

    .hero-main .eyebrow,
    .hero-main .tag {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .hero-main::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 60%;
      height: 150%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      transform: rotate(-20deg);
    }

    .card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .card-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    .card.green { border-top: 4px solid var(--success-color); }
    .card.blue { border-top: 4px solid var(--info-color); }
    .card.cyan { border-top: 4px solid #06b6d4; }
    .card.indigo { border-top: 4px solid var(--indigo-500); }
    .card.orange { border-top: 4px solid var(--warning-color); }

    [data-theme="dark"] .card.cyan { border-top-color: #22d3ee; }
    [data-theme="dark"] .card.indigo { border-top-color: var(--indigo-600); }

    /* 暗色模式下的 Hero 面板适配 */
    [data-theme="dark"] .hero-main {
      background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
      border-color: var(--border-color);
    }
    [data-theme="dark"] .hero-main h1,
    [data-theme="dark"] .hero-main .copy,
    [data-theme="dark"] .hero-main .eyebrow,
    [data-theme="dark"] .hero-main .tag {
      color: var(--text-primary);
    }
    [data-theme="dark"] .hero-main .eyebrow,
    [data-theme="dark"] .hero-main .tag {
      background: var(--bg-secondary);
      border-color: var(--border-color);
    }
    [data-theme="dark"] .hero-main::after {
      opacity: 0.05;
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .bar-name {
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .bar-value {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .track {
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .providers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }

    .provider {
      padding: 20px;
      transition: var(--transition);
    }

    .provider:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-md);
    }

    .provider-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .provider-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .provider-sub {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .provider-badge {
      padding: 4px 8px;
      background: var(--bg-secondary);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .provider-badge i {
      color: var(--warning-color);
    }

    .mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .mini-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mini-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mini-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    .table-card {
      overflow: hidden;
    }

    .table-card .tools {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 14px 20px;
      background: var(--bg-primary);
      color: var(--text-tertiary);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: var(--bg-secondary);
    }

    .mono {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 13px;
    }

    .empty {
      padding: 60px 24px;
      text-align: center;
      display: none;
    }

    .empty i {
      font-size: 48px;
      color: var(--text-tertiary);
      margin-bottom: 20px;
    }

    .empty h3 {
      margin: 0 0 8px;
      color: var(--text-primary);
    }

    .empty p {
      margin: 0;
      color: var(--text-tertiary);
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      padding-bottom: 24px;
    }
  </style>
    <script type="importmap">
    {
        "imports": {
            "preact": "/vendor/preact@11.1.0/preact.mjs",
            "preact/hooks": "/vendor/preact@11.1.0/hooks.mjs",
            "htm": "/vendor/htm@3.1.1/htm.mjs",
            "@preact/signals": "/vendor/signals@2.11.4/signals.mjs",
            "@preact/signals-core": "/vendor/signals-core@1.14.5/signals-core.mjs",
            "@ui/": "/ui/"
        }
    }
    </script>
</head>
<body>
    <div id="page"></div>
    <div id="toastContainer" class="toast-container"></div>
    <script type="module" src="/ui/pages/model-usage-stats.js"></script>
</body>
</html>
