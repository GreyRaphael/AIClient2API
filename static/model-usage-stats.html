<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#059669">
    <script>
        // 尽早应用主题，避免首屏闪白。本块由 scripts/gen-webui-html-head.mjs 生成，勿手改。
        // 三条分支缺一不可：手动选择 > 系统偏好 > 静默失败。
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) { /* localStorage 可能被禁用 */ }
        })();
    </script>

  <title>模型用量统计</title>
  <link rel="stylesheet" href="ui/styles/base.css">
  <link rel="stylesheet" href="vendor/fontawesome@6.7.2/fa-subset.css">
  <link rel="stylesheet" href="ui/styles/shared.css">
  <link rel="stylesheet" href="ui/styles/pages/plugin-shared.css">
  <link rel="stylesheet" href="ui/styles/pages/model-usage-stats.css">
    <script type="importmap">
    {
        "imports": {
            "preact": "/vendor/preact@11.1.0/preact.mjs",
            "preact/hooks": "/vendor/preact@11.1.0/hooks.mjs",
            "htm": "/vendor/htm@3.1.1/htm.mjs",
            "@preact/signals": "/vendor/signals@2.11.4/signals.mjs",
            "@preact/signals-core": "/vendor/signals-core@1.14.5/signals-core.mjs",
            "@ui/": "/ui/"
        }
    }
    </script>
</head>
<body>
    <div id="page"></div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="modal-root"></div>
    <div id="confirm-root"></div>
    <script type="module" src="/ui/pages/model-usage-stats.js"></script>
</body>
</html>
