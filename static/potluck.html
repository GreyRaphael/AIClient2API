<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <script>
        // 提前应用已保存的主题，避免闪烁
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>

    <title>API 大锅饭 - Key 管理</title>
    <link rel="stylesheet" href="app/base.css">
    <link rel="stylesheet" href="vendor/fontawesome@6.7.2/fa-subset.css">
    <link rel="stylesheet" href="app/shared.css">
<style>
        body {
            background: var(--bg-secondary);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .navbar-brand .icon {
            font-size: 28px;
            color: var(--primary-color);
        }
        .navbar-brand .badge {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: #ffffff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-weight: 600;
        }

        /* 主容器 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 24px;
        }

        /* 统计卡片网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-30);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }
        .stat-card.purple::before { background: linear-gradient(90deg, var(--indigo-500), var(--indigo-600)); }
        .stat-card.green::before { background: linear-gradient(90deg, var(--success-color), var(--primary-light)); }
        .stat-card.pink::before { background: linear-gradient(90deg, #ec4899, #f472b6); }
        .stat-card.cyan::before { background: linear-gradient(90deg, var(--info-color), #22d3ee); }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-card.purple .value { color: var(--indigo-500); }
        .stat-card.green .value { color: var(--success-color); }
        .stat-card.pink .value { color: #ec4899; }
        .stat-card.cyan .value { color: var(--info-color); }

        /* 分布统计样式 */
        .distribution-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .distribution-item {
            width: 100%;
        }
        .dist-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .dist-name {
            color: var(--text-primary);
            font-weight: 500;
        }
        .dist-count {
            color: var(--text-secondary);
        }
        .dist-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        .dist-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            border-radius: var(--radius-full);
        }

        /* 区块标题 */

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            width: 220px;
            transition: var(--transition);
            flex: 1;
            min-width: 180px;
        }
        .sort-select {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-10);
        }
        .search-box::placeholder { color: var(--text-tertiary); }

        /* Key 列表 */
        .keys-section { margin-top: 10px; }
        .keys-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .keys-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .key-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .key-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }
        .key-card.disabled { opacity: 0.6; }
        .key-info { flex: 1; min-width: 200px; }
        .key-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .key-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-copy {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }
        .btn-copy:hover {
            background: var(--bg-tertiary);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Key 统计 */
        .key-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            flex: 3;
            align-items: flex-start;
        }
        .key-stat {
            flex: 1;
            min-width: 140px;
            padding: 4px 8px;
            border-left: 2px solid var(--border-color);
        }
        .key-stat:first-child {
            border-left: none;
        }
        .key-stat .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .key-stat .value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .key-stat .value.warning { color: var(--warning-color); }
        .key-stat .value.danger { color: var(--danger-color); }
        .key-stat .value.muted { color: var(--text-tertiary); font-size: 12px; }
        
        /* Key 详情中的分布 */
        .key-dist-mini {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .dist-badge {
            font-size: 10px;
            padding: 2px 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .dist-badge b { color: var(--primary-color); }
        
        .progress-bar {

            height: 6px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success-color), var(--primary-light));
            transition: width 0.3s;
        }
        .progress-bar .fill.warning { background: linear-gradient(90deg, var(--warning-color), #fbbf24); }
        .progress-bar .fill.danger { background: linear-gradient(90deg, var(--danger-color), #f87171); }

        /* Key 操作 */
        .key-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 0;
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: slideIn 0.3s ease;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: var(--transition);
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 表单 */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-10);
        }
        .form-group input::placeholder { color: var(--text-tertiary); }

        /* Key 显示 */
        .key-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--success-color);
            word-break: break-all;
            margin: 16px 0;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state p { font-size: 14px; margin-bottom: 20px; }
        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .btn {
            height: 2.5rem;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .key-card { gap: 12px; }
            .key-stats { gap: 16px; }
            .key-stat { min-width: 60px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .navbar-inner { padding: 0 16px; }
            .main-container { padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .key-card {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .key-info { margin-bottom: 4px; }
            .key-stats {
                width: 100%;
                justify-content: flex-start;
                gap: 20px;
                flex-wrap: wrap;
            }
            .key-stat { min-width: 70px; text-align: left; }
            .key-actions {
                width: 100%;
                justify-content: flex-start;
                padding-top: 12px;
                border-top: 1px solid var(--border-color);
            }
        }

        @media (max-width: 480px) {
            .stat-card .value { font-size: 1.5rem; }
            .keys-header { flex-direction: column; align-items: stretch; gap: 12px; }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search-wrapper {
                display: flex;
                gap: 8px;
                width: 100%;
            }
            .search-box {
                flex: 1;
                min-width: 0;
            }
            .sort-select {
                width: auto;
                flex-shrink: 0;
            }
            .toolbar .btn-limit-wrapper {
                width: 100%;
            }
            .toolbar .btn-limit-wrapper .btn {
                width: 100%;
                justify-content: center;
            }
            .key-stats {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .key-stat {
                min-width: unset;
                text-align: center;
                border-left: none;
                padding: 4px;
            }
            .key-actions {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .navbar-brand .badge { display: none; }
            .navbar-actions { gap: 8px; }
            #createKeyBtn .btn-text { display: none; }
            .theme-toggle { width: 36px; height: 36px; font-size: 1rem; }
        }

        @keyframes slideIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 按钮扩展样式 */
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-lg {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
        }

        /* 移动端 Key 操作按钮样式 */
        @media (max-width: 480px) {
            .key-actions .btn-sm {
                padding: 10px 12px;
                font-size: 13px;
                height: 44px;
            }
        }

        /* 主题切换按钮 */
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.125rem;
            transition: var(--transition);
        }
        .theme-toggle:hover {
            background: var(--bg-secondary);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .theme-toggle .fa-sun { display: none; }
        .theme-toggle .fa-moon { display: inline-block; }
        [data-theme="dark"] .theme-toggle .fa-sun { display: inline-block; }
        [data-theme="dark"] .theme-toggle .fa-moon { display: none; }

        /* Calendar Styles */
        .calendar-panel { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 20px; margin-bottom: 2rem; box-shadow: var(--shadow-sm); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-tertiary); }
        .calendar-legend .level { width: 10px; height: 10px; border-radius: 2px; }
        .calendar-wrapper { overflow-x: auto; padding: 25px 0 10px; scrollbar-width: thin; margin-top: -15px; display: flex; justify-content: center; }
        .calendar-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; min-width: max-content; padding: 2px; }
        .calendar-day { width: 11px; height: 11px; border-radius: 2px; background: var(--bg-secondary); position: relative; cursor: pointer; transition: transform 0.1s; }
        .calendar-day:hover { transform: scale(1.2); z-index: 10; outline: 1px solid var(--primary-color); }
        .calendar-footer { margin-top: 10px; font-size: 12px; color: var(--text-tertiary); text-align: right; }
        .level-0, .calendar-day[data-level="0"] { background: var(--bg-secondary); }
        .level-1, .calendar-day[data-level="1"] { background: #9be9a8; }
        .level-2, .calendar-day[data-level="2"] { background: #40c463; }
        .level-3, .calendar-day[data-level="3"] { background: #30a14e; }
        .level-4, .calendar-day[data-level="4"] { background: #216e39; }
        [data-theme="dark"] .level-1, [data-theme="dark"] .calendar-day[data-level="1"] { background: #0e4429; }
        [data-theme="dark"] .level-2, [data-theme="dark"] .calendar-day[data-level="2"] { background: #006d32; }
        [data-theme="dark"] .level-3, [data-theme="dark"] .calendar-day[data-level="3"] { background: #26a641; }
        [data-theme="dark"] .level-4, [data-theme="dark"] .calendar-day[data-level="4"] { background: #39d353; }
        .calendar-tooltip { position: fixed; padding: 6px 10px; background: rgba(0,0,0,0.9); color: #fff; font-size: 11px; border-radius: 4px; pointer-events: none; z-index: 1000; display: none; box-shadow: 0 3px 10px rgba(0,0,0,0.3); white-space: pre-line; line-height: 1.4; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "preact": "/vendor/preact@11.1.0/preact.mjs",
            "preact/hooks": "/vendor/preact@11.1.0/hooks.mjs",
            "htm": "/vendor/htm@3.1.1/htm.mjs",
            "@preact/signals": "/vendor/signals@2.11.4/signals.mjs",
            "@preact/signals-core": "/vendor/signals-core@1.14.5/signals-core.mjs",
            "@ui/": "/ui/"
        }
    }
    </script>
</head>
<body>
    <div id="page"></div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="modal-root"></div>
    <div id="confirm-root"></div>
    <script type="module" src="/ui/pages/potluck.js"></script>
</body>
</html>
