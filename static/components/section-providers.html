<link rel="stylesheet" href="components/section-providers.css">
<!-- Provider Pools Section -->
<section id="providers" class="section" aria-labelledby="providers-title">
    <h2 id="providers-title" data-i18n="providers.title">提供商池管理</h2>
    <p class="pool-hint">
        <i class="fas fa-info-circle"></i>
        <span data-i18n="providers.note">如使用客户端默认授权配置需使用空节点</span>
    </p>
    <!-- Provider Pool Stats -->
    <div class="stats-grid providers-stats-grid">
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-server"></i>
            </div>
            <div class="stat-info">
                <h3 id="activeConnections">0</h3>
                <p data-i18n="providers.activeConnections">活动连接</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-network-wired"></i>
            </div>
            <div class="stat-info">
                <h3 id="activeProviders">0</h3>
                <p data-i18n="providers.activeProviders">活跃提供商</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="stat-info">
                <h3 id="healthyProviders">0</h3>
                <p data-i18n="providers.healthyProviders">健康提供商</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-layer-group"></i>
            </div>
            <div class="stat-info">
                <h3 id="providerPoolGroups">0</h3>
                <p data-i18n="providers.handoff.groups">已配置分组</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="stat-info">
                <h3 id="providerPoolHealthyNodes">0</h3>
                <p data-i18n="providers.handoff.healthyNodes">健康节点</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-key"></i>
            </div>
            <div class="stat-info">
                <h3 id="providerPoolDefaults">0</h3>
                <p data-i18n="providers.handoff.defaultProviders">预加载供应商</p>
            </div>
        </div>
    </div>

    <!-- Provider Search Bar -->
    <div class="search-bar" style="margin-bottom: 20px;">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="providerSearchInput" data-i18n-placeholder="providers.searchPlaceholder" placeholder="搜索提供商名称或节点内容...">
        </div>
    </div>

    <div class="providers-container">
        <div id="providersList" class="providers-list">
            <!-- Providers will be loaded here -->
        </div>
    </div>
</section>
