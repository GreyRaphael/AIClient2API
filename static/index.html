<!DOCTYPE html>
<html lang="zh-CN" id="html-root" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1f2937">
    <meta name="description" content="AIClient2API Management Console - Unified management of AI service providers">
    <title>AIClient2API - 管理控制台</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <script>
        // 尽早应用暗黑主题，避免首屏闪烁。本块由 scripts/gen-webui-html-head.mjs 生成，勿手改。
        (function () {
            document.documentElement.setAttribute('data-theme', 'dark');
            try { localStorage.removeItem('theme'); } catch (e) { /* localStorage 可能被禁用 */ }
        })();
    </script>
    <link rel="stylesheet" href="ui/styles/base.css">
    <link rel="stylesheet" href="ui/styles/shared.css?v=20261028-1">
    <link rel="stylesheet" href="ui/styles/components/header.css">
    <link rel="stylesheet" href="ui/styles/components/sidebar.css">
    <!-- 各 section 专属样式由 ui/lib/section-styles.js 在切换页面时按需插入（位于 alignment.css 之前） -->
    <link rel="stylesheet" href="ui/styles/mobile.css">
    <link rel="stylesheet" href="vendor/fontawesome@6.7.2/fa-subset.css">
    <script type="importmap">
    {
        "imports": {
            "preact": "/vendor/preact@11.1.0/preact.mjs",
            "preact/hooks": "/vendor/preact@11.1.0/hooks.mjs",
            "htm": "/vendor/htm@3.1.1/htm.mjs",
            "@preact/signals": "/vendor/signals@2.11.4/signals.mjs",
            "@preact/signals-core": "/vendor/signals-core@1.14.5/signals-core.mjs",
            "@ui/": "/ui/"
        }
    }
    </script>
    <link rel="modulepreload" href="/ui/main.js">
</head>
<body>
    <!-- Preact 外壳（Header / Sidebar / Section）挂载点 -->
    <div id="app"></div>

    <!-- 对齐修正层：需位于所有动态加载的组件样式之后 -->
    <link rel="stylesheet" href="ui/styles/alignment.css?v=20261030-1">

    <!-- 全局 Toast 容器（store/toast.js 的唯一渲染目标） -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- 弹窗根节点（后续迁移的 Modal 使用） -->
    <div id="modal-root"></div>
    <div id="confirm-root"></div>

    <!-- 旧模块初始化（等待外壳派发 componentsLoaded） -->
    <!-- 新外壳入口：鉴权 -> 挂载 App -> 启动 SSE -->
    <script type="module" src="ui/main.js"></script>
</body>
</html>
