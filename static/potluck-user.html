<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <script>
        // 提前应用已保存的主题，避免闪烁
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>

    <title>API 大锅饭 - 我的用量</title>
    <link rel="stylesheet" href="ui/styles/base.css">
    <link rel="stylesheet" href="vendor/fontawesome@6.7.2/fa-subset.css">
    <link rel="stylesheet" href="ui/styles/shared.css">
<style>
        body {
            background: var(--bg-secondary);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .navbar-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .navbar-brand .icon {
            font-size: 28px;
            color: var(--primary-color);
        }
        .navbar-brand .badge {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: #ffffff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-weight: 600;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar-user .welcome {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .navbar-user .welcome strong { color: var(--text-primary); }
        
        /* 主题切换按钮 */
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.125rem;
            transition: var(--transition);
        }
        .theme-toggle:hover {
            background: var(--bg-secondary);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .theme-toggle .fa-sun { display: none; }
        .theme-toggle .fa-moon { display: inline-block; }
        [data-theme="dark"] .theme-toggle .fa-sun { display: inline-block; }
        [data-theme="dark"] .theme-toggle .fa-moon { display: none; }

        /* 主容器 */
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 24px;
        }

        /* 区块标题 */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-30);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }
        .stat-card.purple::before { background: linear-gradient(90deg, var(--indigo-500), var(--indigo-600)); }
        .stat-card.green::before { background: linear-gradient(90deg, var(--success-color), var(--primary-light)); }
        .stat-card.cyan::before { background: linear-gradient(90deg, var(--info-color), #22d3ee); }
        .stat-card.orange::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-card .value .dim {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .stat-card.purple .value > span:first-child { color: var(--indigo-500); }
        .stat-card.green .value > span:first-child { color: var(--success-color); }
        .stat-card.cyan .value { color: var(--info-color); }
        .stat-card.orange .value { color: #f59e0b; font-size: 1.25rem; margin-top: 0.5rem; }

        /* 分布统计样式 */
        .distribution-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .distribution-item {
            width: 100%;
        }
        .dist-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .dist-name {
            color: var(--text-primary);
            font-weight: 500;
        }
        .dist-count {
            color: var(--text-secondary);
        }
        .dist-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        .dist-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            border-radius: var(--radius-full);
        }

        /* 登录页面 */

        .login-container {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .login-box h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 8px;
        }
        .login-box .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            transition: var(--transition);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-10);
        }
        .form-input::placeholder { color: var(--text-tertiary); }
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .form-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }

        /* API Key 显示区域 */
        .apikey-display {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .apikey-display input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            color: var(--success-color);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .apikey-display input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 提示信息 */
        .info-box {
            background: var(--info-bg-lighter);
            border: 1px solid var(--info-border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-top: 20px;
        }
        .info-box p {
            font-size: 13px;
            color: var(--info-text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            height: 2.5rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar-inner { padding: 0 16px; }
            .navbar-user .welcome { display: none; }
            .main-container { padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .login-box { padding: 24px; }
        }
        @media (max-width: 480px) {
            .stat-card .value { font-size: 1.5rem; }
            .stat-card .value .dim { font-size: 1rem; }
            .navbar-brand .badge { display: none; }
        }

        /* 按钮块级样式 */
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .calendar-panel { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 20px; margin-bottom: 2rem; box-shadow: var(--shadow-sm); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-tertiary); }
        .calendar-legend .level { width: 10px; height: 10px; border-radius: 2px; }
        .calendar-wrapper { overflow-x: auto; padding: 25px 0 10px; scrollbar-width: thin; margin-top: -15px; display: flex; justify-content: center; }
        .calendar-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; min-width: max-content; padding: 2px; }
        .calendar-day { width: 11px; height: 11px; border-radius: 2px; background: var(--bg-secondary); position: relative; cursor: pointer; transition: transform 0.1s; }
        .calendar-day:hover { transform: scale(1.2); z-index: 10; outline: 1px solid var(--primary-color); }
        .calendar-footer { margin-top: 10px; font-size: 12px; color: var(--text-tertiary); text-align: right; }
        .level-0, .calendar-day[data-level="0"] { background: var(--bg-secondary); }
        .level-1, .calendar-day[data-level="1"] { background: #9be9a8; }
        .level-2, .calendar-day[data-level="2"] { background: #40c463; }
        .level-3, .calendar-day[data-level="3"] { background: #30a14e; }
        .level-4, .calendar-day[data-level="4"] { background: #216e39; }
        [data-theme="dark"] .level-1, [data-theme="dark"] .calendar-day[data-level="1"] { background: #0e4429; }
        [data-theme="dark"] .level-2, [data-theme="dark"] .calendar-day[data-level="2"] { background: #006d32; }
        [data-theme="dark"] .level-3, [data-theme="dark"] .calendar-day[data-level="3"] { background: #26a641; }
        [data-theme="dark"] .level-4, [data-theme="dark"] .calendar-day[data-level="4"] { background: #39d353; }
        .calendar-tooltip { position: fixed; padding: 6px 10px; background: rgba(0,0,0,0.9); color: #fff; font-size: 11px; border-radius: 4px; pointer-events: none; z-index: 1000; display: none; box-shadow: 0 3px 10px rgba(0,0,0,0.3); white-space: pre-line; line-height: 1.4; }

    </style>
    <script type="importmap">
    {
        "imports": {
            "preact": "/vendor/preact@11.1.0/preact.mjs",
            "preact/hooks": "/vendor/preact@11.1.0/hooks.mjs",
            "htm": "/vendor/htm@3.1.1/htm.mjs",
            "@preact/signals": "/vendor/signals@2.11.4/signals.mjs",
            "@preact/signals-core": "/vendor/signals-core@1.14.5/signals-core.mjs",
            "@ui/": "/ui/"
        }
    }
    </script>
</head>
<body>
    <div id="page"></div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="modal-root"></div>
    <div id="confirm-root"></div>
    <script type="module" src="/ui/pages/potluck-user.js"></script>
</body>
</html>
