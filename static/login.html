<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AIClient2API</title>
    <link rel="icon" type="image/x-icon" href="https://src.hex2077.dev/logo/favicon.ico">
    <script type="importmap">
    {
        "imports": {
            "preact": "/vendor/preact@11.1.0/preact.mjs",
            "preact/hooks": "/vendor/preact@11.1.0/hooks.mjs",
            "htm": "/vendor/htm@3.1.1/htm.mjs",
            "@preact/signals": "/vendor/signals@2.11.4/signals.mjs",
            "@preact/signals-core": "/vendor/signals-core@1.14.5/signals-core.mjs",
            "@ui/": "/ui/"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            position: relative;
            overflow: hidden;
            background: var(--bg-glass-strong, #fff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 20px;
            box-shadow: 0 24px 60px -20px rgba(15, 23, 42, 0.25), 0 4px 12px rgba(15, 23, 42, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 420px;
            padding: 44px 40px 36px;
            animation: fadeIn 0.5s ease-in;
        }

        .login-container::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 4px;
            background: var(--gradient-accent, linear-gradient(135deg, #059669, #6366f1));
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 0 0 4px var(--bg-primary, #fff), 0 0 0 6px var(--primary-20, rgba(5, 150, 105, 0.2));
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary, #333);
            margin-bottom: 5px;
        }

        .logo p {
            font-size: 14px;
            color: var(--text-secondary, #666);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary, #333);
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color, #e1e8ed);
            border-radius: 10px;
            background: var(--bg-secondary, #fff);
            color: var(--text-primary, #333);
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:hover {
            border-color: var(--border-hover, #cbd5e1);
        }

        .form-group input:focus {
            border-color: var(--primary-color, #059669);
            background: var(--bg-primary, #fff);
            box-shadow: 0 0 0 3px var(--primary-20, rgba(5, 150, 105, 0.2));
        }

        .form-group input::placeholder {
            color: var(--text-tertiary, #aaa);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-message.show {
            display: block;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: var(--gradient-primary, linear-gradient(135deg, #059669 0%, #10b981 100%));
            color: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 18px -8px rgba(5, 150, 105, 0.6);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(5, 150, 105, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color, #e1e8ed);
        }

        .footer p {
            font-size: 13px;
            color: var(--text-tertiary, #999);
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="app/base.css">
    <script>
        // 与主界面保持一致：提前应用已保存的主题，避免闪烁
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="app/shared.css">
    <link rel="stylesheet" href="vendor/fontawesome@6.7.2/fa-subset.css">
</head>
<body>
    <div id="page"></div>
    <div id="toastContainer" class="toast-container"></div>
    <script type="module" src="/ui/pages/login.js"></script>
</body>
</html>
